services:
  - type: web
    name: codekids
    env: docker
    region: oregon
    plan: free
    envVars:
      - key: GROQ_REASONING_EFFORT
        value: "low"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: GROQ_FALLBACK_MODEL
        value: "openai/gpt-oss-20b"
      - key: GEMINI_MODEL
        value: "gemini-3.6-flash"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
